<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sunset @ 就在日落以后 Aut Nihilo</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DT0G2Z1V8F"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-DT0G2Z1V8F');
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;1,700&family=Inter:wght@300;400;600&family=Noto+Serif+SC:wght@500&family=Noto+Sans+SC:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="apple-touch-icon" sizes="180x180" href="img/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon/favicon-16x16.png">
    <link rel="manifest" href="img/favicon/site.webmanifest">    

    <style>
        :root { --concert-white: #ffffff; }
        
        body, html { 
            margin: 0; padding: 0; 
            /* Universal Mobile Height Fixes */
            height: 100vh; 
            height: 100dvh; 
            width: 100%; overflow: hidden; 
            background: linear-gradient(to bottom, #0f2763 0%, #164382 40%, #7c4a03 80%, #b0600b 100%);
        }

        #map { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            z-index: 0; 
            filter: brightness(1.3) contrast(0.8) saturate(0.8); 
            mix-blend-mode: overlay;
            opacity: 1;
        }

        .content-overlay {
            position: relative; z-index: 10; 
            height: 100vh; height: 100dvh;
            pointer-events: none; display: flex; flex-direction: column; align-items: center;
        }

        .interactive-card {
            pointer-events: auto; 
            background: rgba(15, 23, 42, 0.4); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Typography */
        .tour-label { font-family: 'Inter', sans-serif; letter-spacing: 0.6em; font-size: 0.65rem; opacity: 0.8; color: white; }
        .chinese-title { font-family: 'Noto Serif SC', sans-serif; font-size: 3.5rem; line-height: 1.1; letter-spacing: 0.05em; color: white; }
        .serif-detail { font-family: 'Bodoni Moda', serif; letter-spacing: 0.02em; font-size: 1.25rem; color: white; }
        
        .inter-ui { 
            font-family: 'Inter', sans-serif; 
            font-size: 10px !important; 
            text-transform: uppercase; 
            letter-spacing: 0.05em;
        }

        @media (min-width: 768px) {
            .chinese-title { font-size: 5rem; }
            .serif-detail { font-size: 1.8rem; }
        }

        /* Fixed Marker Positioning */
        .marker-container {
            width: 12px; height: 12px;
            display: flex; align-items: center; justify-content: center;
        }

        .custom-marker { 
            width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid white; 
            cursor: pointer; pointer-events: auto !important; position: absolute;
        }
        .marker-past { background: rgba(255, 255, 255, 0.2); border-color: rgba(255,255,255,0.3); }
        .marker-future { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.6); }
        .marker-active { background: #fff; box-shadow: 0 0 20px #fbbf24; }

        .pulse-ring {
            position: absolute; width: 12px; height: 12px; border-radius: 50%;
            border: 1.5px solid white; animation: ring-pulse 2.5s infinite;
            pointer-events: none;
        }
        @keyframes ring-pulse { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(5); opacity: 0; } }

        .custom-tooltip {
            background: rgba(15, 23, 42, 0.95) !important;
            border: 1px solid rgba(217, 119, 6, 0.4) !important;
            color: white !important;
            font-family: 'Inter', sans-serif !important;
            font-size: 10px !important;
            border-radius: 2px !important;
            padding: 8px !important;
            text-transform: uppercase !important;
        }

        details summary { list-style: none; cursor: pointer; outline: none; }
        details summary::-webkit-details-marker { display: none; }
        .custom-scroll::-webkit-scrollbar { width: 2px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }

        .leaflet-control-container { display: none; }

        .page-footer {
            width: 100%;
            z-index: 20;
            pointer-events: none; 
            text-align: center;
            /* Safe area insets for notched iPhones */
            padding-bottom: calc(1rem + env(safe-area-inset-bottom));
            padding-top: 1rem;
        }
        .footer-text {
            font-family: 'Inter', sans-serif; font-size: 0.5rem;
            letter-spacing: 0.05em; opacity: 0.5; color: white;
            text-transform: uppercase; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="content-overlay py-8 px-6" id="ui-wrapper">
        <header class="text-center mt-10 md:mt-16 flex flex-col items-center">
            <h2 class="tour-label uppercase font-bold mb-6 text-center">就在日落以后 <br />Aut Nihilo Concert Tour</h2>
            <div id="city-cn" class="chinese-title font-medium mb-1">新加坡</div>
            <div id="city-en" class="serif-detail mb-6">Singapore</div>
            <div class="flex flex-col gap-1 items-center">
                <div id="date-display" class="serif-detail">2026.01.01</div>
                <div id="time-display" class="serif-detail">Sunset Today | --:--:-- PM</div>
            </div>
        </header>

        <div class="w-full max-w-sm interactive-card p-5 rounded-2xl shadow-2xl mt-auto overflow-hidden">
            <div id="tour-list" class="max-h-[30dvh] md:max-h-[250px] overflow-y-auto custom-scroll pr-1 text-white">
                </div>
        </div>

        <footer class="page-footer">
            <div class="footer-text p-1">
                This is a personal project and <em>not</em> an official source. For tour announcements, follow the official accounts of Stefanie Sun.
            </div>
        </footer>
    </div>

    <script>
        const cityMap = {
            "Singapore": "新加坡", 
            "Shanghai": "上海", 
            "Shenzhen": "深圳",
            "Beijing": "北京", 
            "Qingdao": "青岛",
            "Kaohsiung": "高雄", 
            "Chongqing": "重庆", 
            "Nanjing": "南京", 
            "Hong Kong": "香港", 
            "Suzhou": "苏州",
            "Kuala Lumpur": "吉隆坡", 
            "Taipei": "台北",
            "Tianjin": "天津",
            "Hangzhou": "杭州",
            "Changsha": "长沙",
            "Guangzhou": "广州"
        };

        const tourData = [
            { city: "Singapore", dates: ["2025-04-05", "2025-04-06", "2025-04-12", "2025-04-13"], lat: 1.3521, lng: 103.8198 },
            { city: "Shanghai", dates: ["2025-04-26", "2025-04-28"], lat: 31.2304, lng: 121.4737 },
            { city: "Shenzhen", dates: ["2025-05-16", "2025-05-18"], lat: 22.5431, lng: 114.0579 },
            { city: "Beijing", dates: ["2025-06-13", "2025-06-15"], lat: 39.9042, lng: 116.4074 },
            { city: "Qingdao", dates: ["2025-07-18", "2025-07-20"], lat: 36.0671, lng: 120.3826 },
            { city: "Kaohsiung", dates: ["2025-08-16", "2025-08-17"], lat: 22.6273, lng: 120.3014 },
            { city: "Chongqing", dates: ["2025-09-19", "2025-09-21"], lat: 29.5630, lng: 106.5516 },
            { city: "Nanjing", dates: ["2025-10-24", "2025-10-26"], lat: 32.0603, lng: 118.7969 },
            { city: "Hong Kong", dates: ["2026-03-13", "2026-03-15"], lat: 22.3193, lng: 114.1694 },
            { city: "Suzhou", dates: ["2026-04-10", "2026-04-12"], lat: 31.2989, lng: 120.5853 },
            { city: "Kuala Lumpur", dates: ["2026-04-25","2026-04-26"], lat: 3.1390, lng: 101.6869 },
            { city: "Taipei", dates: ["2026-05-15","2026-05-17"], lat: 25.0330, lng: 121.5654 },
            { city: "Tianjin", dates: ["2026-09-11","2026-09-13"], lat: 39.1236, lng: 117.1981 },
            { city: "Hangzhou", dates: ["2026-10-09","2026-10-11"], lat: 30.2741, lng: 120.1551 },
            { city: "Changsha", dates: ["2026-11-06","2026-11-08"], lat: 28.2278, lng: 112.9388 },
            { city: "Guangzhou", dates: ["TBA"], lat: 23.1291, lng: 113.2644 }
        ];

        async function init() {
            const now = new Date();
            const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
            const localStartOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            let activeCity = tourData.find(c => c.dates.some(d => d === "TBA" || new Date(d.replace(/-/g, '/')) >= localStartOfDay)) || tourData[0];
            
            const map = L.map('map', { center: [20, 115], zoom: 4, zoomControl: false, attributionControl: false });
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

            const flattened = [];
            tourData.forEach(city => city.dates.forEach(d => flattened.push({ city: city.city, date: d })));
            
            const upcoming = flattened
                .filter(show => show.date === "TBA" || new Date(show.date.replace(/-/g, '/')) >= localStartOfDay)
                .sort((a, b) => {
                    if (a.date === "TBA") return 1;
                    if (b.date === "TBA") return -1;
                    return new Date(a.date.replace(/-/g, '/')) - new Date(b.date.replace(/-/g, '/'));
                });

            const past = flattened
                .filter(show => show.date !== "TBA" && new Date(show.date.replace(/-/g, '/')) < localStartOfDay)
                .sort((a, b) => new Date(b.date.replace(/-/g, '/')) - new Date(a.date.replace(/-/g, '/')));

            const list = document.getElementById('tour-list');
            list.innerHTML = `${createAccordion('upcoming-accordion', 'Upcoming', upcoming, true, todayStr)}<div class="my-3 border-b border-white/10"></div>${createAccordion('past-accordion', 'Completed', past, false, todayStr)}`;

            const details = list.querySelectorAll('details');
            details.forEach(d => {
                d.addEventListener('toggle', () => {
                    if (d.open) details.forEach(other => { if (other !== d) other.removeAttribute('open'); });
                });
            });

            const formattedDate = now.getFullYear() + '.' + String(now.getMonth() + 1).padStart(2, '0') + '.' + String(now.getDate()).padStart(2, '0');
            document.getElementById('date-display').innerText = formattedDate;
            document.getElementById('city-cn').innerText = cityMap[activeCity.city] || activeCity.city;
            document.getElementById('city-en').innerText = activeCity.city;

            if (activeCity.lat !== 0) fetchSunset(activeCity);

            tourData.forEach(city => {
                const dates = city.dates;
                const allPast = dates.every(d => d !== "TBA" && new Date(d.replace(/-/g, '/')) < localStartOfDay);
                const isCurrent = dates.some(d => d === todayStr);
                const state = isCurrent ? 'marker-active' : (allPast ? 'marker-past' : 'marker-future');
                
                const icon = L.divIcon({
                    className: 'marker-container',
                    html: `${isCurrent ? '<div class="pulse-ring"></div>' : ''}<div class="custom-marker ${state}"></div>`,
                    iconSize: [12, 12], iconAnchor: [6, 6]
                });

                const tooltipContent = `<div style="text-align:left; line-height: 1.5;"><span style="border-bottom: 1px solid rgba(255,255,255,0.3); display: block; padding-bottom: 2px; margin-bottom: 4px; font-weight: 700;">${city.city.toUpperCase()}</span>${city.dates.map(d => d === "TBA" ? "TBA" : d.replace(/-/g, '.')).join('<br>')}</div>`;

                L.marker([city.lat, city.lng], { icon, interactive: true }).addTo(map).bindTooltip(tooltipContent, { className: 'custom-tooltip', direction: 'top', offset: [0, -10], opacity: 1 });
            });

            setTimeout(() => map.flyTo([activeCity.lat, activeCity.lng], 7, { duration: 3 }), 1000);
        }

        function createAccordion(id, title, shows, isOpen, todayStr) {
            if (shows.length === 0) return '';
            return `<details id="${id}" ${isOpen ? 'open' : ''} class="group"><summary class="flex justify-between items-center py-1 text-[9px] font-bold uppercase tracking-[0.3em] opacity-40 group-hover:opacity-100 transition-opacity">${title}<svg class="w-2.5 h-2.5 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"></path></svg></summary><div class="mt-2 space-y-2 pb-2">${shows.map(show => {
                const isToday = show.date === todayStr;
                const isTBA = show.date === "TBA";
                const opacity = (!isTBA && new Date(show.date.replace(/-/g, '/')) < new Date(todayStr.replace(/-/g, '/'))) ? 'opacity-30' : 'opacity-100';
                return `<div class="flex justify-between items-baseline ${opacity} ${isToday ? 'text-white font-bold' : ''} border-b border-white/5 pb-1 inter-ui"><span class="tracking-wider">${show.city}</span><span>${isTBA ? "TBA" : show.date.replace(/-/g, '.')}</span></div>`;
            }).join('')}</div></details>`;
        }

        async function fetchSunset(loc) {
            try {
                const res = await fetch(`https://api.sunrise-sunset.org/json?lat=${loc.lat}&lng=${loc.lng}&formatted=0`);
                const data = await res.json();
                const sunset = new Date(data.results.sunset);
                const time = sunset.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }).toUpperCase();
                document.getElementById('time-display').innerText = `Sunset Today | ${time}`;
            } catch { document.getElementById('time-display').innerText = `Sunset Today | --:--:-- PM`; }
        }

        window.onload = init;
    </script>
</body>
</html>
